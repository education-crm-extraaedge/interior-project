<script>
(function(){
  var root=document.getElementById('stories'); if(!root) return;
  var rail=root.querySelector('.cs3-rail');
  var cards=[].slice.call(root.querySelectorAll('.cs3-card'));
  var cap=document.getElementById('cs3Cap'), capQ=document.getElementById('cs3Q'), capN=document.getElementById('cs3N'), capL=document.getElementById('cs3Logo');
  var active=-1, raf=0, capT=0;

  cards.forEach(function(c){ c.__media=c.innerHTML; });
  function stop(c){
    if(!c.classList.contains('playing')) return;
    c.classList.remove('playing');
    c.innerHTML=c.__media;
  }
  /* The speaker's logo is optional: a card with no data-logo - or one whose
     image fails to load - just shows the name on its own, no empty box. */
  function setLogo(c){
    if(!capL) return;
    var src=c.getAttribute('data-logo')||'';
    if(!src){ capL.hidden=true; capL.removeAttribute('src'); return; }
    capL.onerror=function(){ capL.hidden=true; };
    capL.src=src;
    capL.alt=(c.dataset.n||'')+' logo';
    capL.hidden=false;
  }
  /* the caption always narrates whichever card is centred on the stage */
  function caption(c){
    clearTimeout(capT);
    cap.classList.add('fade');
    capT=setTimeout(function(){
      capQ.innerHTML=c.dataset.q;
      capN.innerHTML='<b>'+c.dataset.n+'</b>, '+c.dataset.r;
      setLogo(c);
      cap.classList.remove('fade');
    },160);
  }
  function update(){
    raf=0;
    var mid=rail.scrollLeft+rail.clientWidth/2, best=0, bd=Infinity;
    cards.forEach(function(c,i){
      var d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);
      if(d<bd){bd=d;best=i;}
    });
    if(best!==active){
      active=best;
      cards.forEach(function(c,i){ c.classList.toggle('on',i===best); if(i!==best) stop(c); });
      caption(cards[best]);
    }
  }
  rail.addEventListener('scroll',function(){ if(!raf) raf=requestAnimationFrame(update); },{passive:true});
  update();

  function center(c){ rail.scrollTo({left:c.offsetLeft+c.offsetWidth/2-rail.clientWidth/2,behavior:'smooth'}); }
  function play(c){
    if(c.classList.contains('playing')) return;
    c.classList.add('playing');
    c.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+c.dataset.yt+
      '?autoplay=1&rel=0&modestbranding=1" title="Customer story video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  }
  cards.forEach(function(c){
    c.addEventListener('click',function(){ c.classList.contains('on') ? play(c) : center(c); });
    c.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); c.classList.contains('on') ? play(c) : center(c); } });
  });
  var pb=document.getElementById('cs3Play');
  if(pb) pb.addEventListener('click',function(){ if(active>-1) play(cards[active]); });

  var aL=root.querySelector('.cs3-arw--l'), aR=root.querySelector('.cs3-arw--r');
  function go(dir){ var n=Math.min(Math.max(active+dir,0),cards.length-1); center(cards[n]); }
  if(aL) aL.addEventListener('click',function(){go(-1); restart();});
  if(aR) aR.addEventListener('click',function(){go(1); restart();});

  /* ── auto-advance: one story every 3 seconds ──
     Pauses while the visitor hovers or touches the rail, while a video is
     playing, when the tab or section is off-screen, and for reduced-motion
     visitors; loops back to the first story after the last. */
  var auto=null, inView=false;
  var noMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    if(document.hidden || !inView) return;
    if(root.querySelector('.cs3-card.playing')) return;
    center(cards[(active+1)%cards.length]);
  }
  function startAuto(){ if(!auto && !noMotion) auto=setInterval(tick,3000); }
  function stopAuto(){ if(auto){ clearInterval(auto); auto=null; } }
  function restart(){ stopAuto(); startAuto(); }
  try{
    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){ inView=x.isIntersecting; });
    },{threshold:.35});
    io.observe(root);
  }catch(e){ inView=true; }
  rail.addEventListener('mouseenter',stopAuto);
  rail.addEventListener('mouseleave',startAuto);
  rail.addEventListener('touchstart',stopAuto,{passive:true});
  rail.addEventListener('touchend',function(){ restart(); },{passive:true});
  cards.forEach(function(c){ c.addEventListener('click',restart); });
  startAuto();
})();
</script>

           On single blog posts the visitor wants maximum reading room,
           so the header slides up when scrolling DOWN past the hero
           and slides back into view the moment they scroll UP. Other
           page types keep the header sticky (just adds the scroll
           shadow). */
        (function(){
            var hdr = document.getElementById('site-header');
            if (!hdr) return;
            var isPost   = document.body.classList.contains('single-post') ||
                           document.body.classList.contains('single-industry') ||
                           document.body.classList.contains('single-use_case') ||
                           document.body.classList.contains('ee-singular') &&
                           document.body.classList.contains('single');
            var lastY    = window.scrollY || 0;
            var ticking  = false;
            function onScroll(){
                var y = window.scrollY || 0;
                hdr.classList.toggle('scrolled', y > 50);
                /* Auto-hide only on long-form post pages where the
                   reader actively wants more room. */
                if (isPost) {
                    var goingDown = y > lastY;
                    var pastHero  = y > 240;
                    if (goingDown && pastHero) {
                        hdr.classList.add('eh-hidden');
                    } else {
                        hdr.classList.remove('eh-hidden');
                    }
                }
                lastY = y;
                ticking = false;
            }
            window.addEventListener('scroll', function(){
                if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
            }, { passive: true });
        })();

        // Mobile Menu Toggle
        const openBtn = document.getElementById('openMobileBtn');
        const closeBtn = document.getElementById('closeMobileBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        if (openBtn) openBtn.addEventListener('click', () => {
            mobileMenu.classList.add('active');
            openBtn.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        });

        if (closeBtn) closeBtn.addEventListener('click', () => {
            mobileMenu.classList.remove('active');
            if (openBtn) openBtn.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = 'auto';
        });

        // Mobile Accordion Logic
        function toggleAccordion(btn) {
            const item = btn.parentElement;
            const wasActive = item.classList.contains('active');
            document.querySelectorAll('.mobile-accordion-item').forEach(el => {
                if (el !== item) {
                    el.classList.remove('active');
                    const b = el.querySelector('button[aria-expanded]'); if (b) b.setAttribute('aria-expanded', 'false');
                }
            });
            item.classList.toggle('active');
            btn.setAttribute('aria-expanded', wasActive ? 'false' : 'true');
        }

        // Reveal animations on load
        window.addEventListener('load', () => {
            document.querySelectorAll('.reveal').forEach((el, i) => {
                setTimeout(() => el.classList.add('active'), i * 150);
            });
        });

        // Scroll Progress Bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            const progressEl = document.getElementById('progress');
            if (progressEl) {
                progressEl.style.width = scrolled + '%';
                progressEl.setAttribute('aria-valuenow', Math.round(scrolled));
            }
        });

        // ───────── Sticky-fail guard ─────────
        // If some page-level CSS (typically `overflow:hidden` on an ancestor or
        // a transform on <body>) silently kills position:sticky, the header
        // visually disappears after the first scroll. We detect that and
        // promote the header to position:fixed so it stays usable.
        (function(){
            const header = document.getElementById('site-header');
            if (!header) return;

            // Measure once so the body padding shim fills the gap when fixed
            function setHeaderHeightVar() {
                document.documentElement.style.setProperty('--ee-header-h', header.offsetHeight + 'px');
            }
            setHeaderHeightVar();
            window.addEventListener('resize', setHeaderHeightVar);

            let lastTop = null;
            function check() {
                const rect = header.getBoundingClientRect();
                // Sticky behaviour means top stays at 0 when scrolled. If we
                // see top < 0 the header has scrolled away — sticky is broken.
                if (rect.top < -2 && !header.classList.contains('ee-force-fixed')) {
                    header.classList.add('ee-force-fixed');
                    document.body.classList.add('ee-header-fixed');
                    setHeaderHeightVar();
                }
                lastTop = rect.top;
            }
            // Initial check after layout settles
            requestAnimationFrame(check);
            window.addEventListener('scroll', check, { passive: true });
        })();

<script>
/* Anchor-landing corrector: with content-visibility, sections render
   just-in-time while a long smooth anchor-scroll is in flight, so estimated
   heights can leave the jump a few hundred px off. Shortly after any hash
   navigation, re-align the target once (instant, imperceptible). Armed only
   around hash changes so normal scrolling is never touched. */
(function(){
  var armedUntil=0;
  function check(){
    if(Date.now()>armedUntil) return;
    var h=location.hash; if(!h||h.length<2) return;
    var el=document.getElementById(decodeURIComponent(h.slice(1))); if(!el) return;
    var sm=parseFloat(getComputedStyle(el).scrollMarginTop)||0;
    var top=el.getBoundingClientRect().top;
    if(Math.abs(top-sm)>12){
      window.scrollTo({top:Math.round(window.pageYOffset+top-sm),left:0,behavior:'instant'});
    }
  }
  function arm(){ armedUntil=Date.now()+2400; setTimeout(check,700); setTimeout(check,1500); setTimeout(check,2300); }
  window.addEventListener('hashchange',arm);
  if(location.hash){ (document.readyState==='complete') ? arm() : window.addEventListener('load',arm); }
})();
</script>
